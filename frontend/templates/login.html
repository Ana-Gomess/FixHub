<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | FixHub</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>

    <header class="topbar">
        <a href="/login" class="marca">
            <span class="marca-icone">⌂</span>
            <span>Fix<span>Hub</span></span>
        </a>

        <p>Condomínio bem cuidado, com tudo em um só lugar.</p>
    </header>

    <main class="pagina">

        <section class="login-card">

            <div class="logo">
                <div class="logo-icone">⌂</div>
                <h1>Fix<span>Hub</span></h1>
            </div>

            <div class="introducao">
                <h2>Bem-vindo de volta!</h2>
                <p>
                    Entre na sua conta para acompanhar
                    seus chamados de manutenção.
                </p>
            </div>

            <form id="formLogin">

                <div class="campo">
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>

                    <div class="senha-container">
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="mostrarSenha"
                            aria-label="Mostrar senha"
                        >
                            Mostrar
                        </button>
                    </div>
                </div>

                <button type="submit" id="botaoLogin">
                    Entrar na conta
                </button>

                <p id="mensagem" role="status" aria-live="polite"></p>

            </form>

            <footer class="rodape">
                <span>Ainda não possui uma conta?</span>
                <a href="/cadastro">Criar conta</a>
            </footer>

        </section>

    </main>

    <script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>
</html>
