<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus chamados | FixHub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chamado_novo.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/meus_chamados.css') }}">
</head>
<body>
    <header class="topbar">
        <a class="marca" href="/meus-chamados" aria-label="FixHub - Meus chamados">
            <span class="marca-icone" aria-hidden="true">⌂</span>
            <span>Fix<span>Hub</span></span>
        </a>
        <p>Condomínio bem cuidado, com tudo em um só lugar.</p>
    </header>

    <main class="pagina">
        <section class="chamado-card lista-card" aria-labelledby="titulo-pagina">
            <div class="logo" aria-hidden="true">
                <span class="logo-icone">⌂</span>
                <span class="logo-nome">Fix<span>Hub</span></span>
            </div>

            <div class="introducao">
                <h1 id="titulo-pagina">Meus chamados</h1>
                <p>Acompanhe as solicitações de manutenção que você abriu.</p>
            </div>

            <div class="acoes-lista">
                <a class="botao-link" href="/chamados/novo">Abrir chamado</a>
            </div>

            <p id="mensagemLista" class="mensagem-lista" role="status" aria-live="polite">
                Carregando seus chamados...
            </p>
            <div id="listaChamados" class="lista-chamados"></div>
            <button id="botaoTentarNovamente" class="botao-secundario" type="button" hidden>
                Tentar novamente
            </button>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/meus_chamados.js') }}"></script>
</body>
</html>
