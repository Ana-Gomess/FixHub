<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus chamados | FixHub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/meus_chamados.css') }}">
</head>
<body>
    <header class="topbar">
        <a class="marca" href="/chamados/novo" aria-label="FixHub">
            <span class="marca-icone" aria-hidden="true">⌂</span>
            <span>Fix<span>Hub</span></span>
        </a>
        <p>Condomínio bem cuidado, com tudo em um só lugar.</p>
    </header>

    <main class="pagina">
        <section class="lista-card" aria-labelledby="titulo-pagina">
            <div class="cabecalho-lista">
                <div class="introducao">
                    <h1 id="titulo-pagina">Meus chamados</h1>
                    <p>Acompanhe os chamados de manutenção que você abriu.</p>
                </div>
                <a class="botao-novo" href="/chamados/novo">Abrir chamado</a>
            </div>

            <div
                id="estadoLista"
                class="estado-lista estado-lista--carregando"
                role="status"
                aria-live="polite"
                aria-atomic="true"
            >
                <span class="indicador-carregamento" aria-hidden="true"></span>
                <p>Carregando seus chamados...</p>
            </div>

            <ul
                id="listaChamados"
                class="lista-chamados"
                aria-label="Chamados abertos por você"
                hidden
            ></ul>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/meus_chamados.js') }}" defer></script>
</body>
</html>
