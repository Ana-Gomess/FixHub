<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel administrativo | FixHub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/meus_chamados.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/painel_admin.css') }}">
</head>
<body>
    <header class="topbar">
        <a class="marca" href="/painel-admin" aria-label="FixHub - Painel administrativo">
            <span class="marca-icone" aria-hidden="true">⌂</span>
            <span>Fix<span>Hub</span></span>
        </a>
        <p class="descricao-topbar">Condomínio bem cuidado, com tudo em um só lugar.</p>
    </header>

    <main class="pagina">
        <section class="lista-card painel-card" aria-labelledby="titulo-pagina">
            <div class="cabecalho-lista">
                <div class="introducao">
                    <h1 id="titulo-pagina">Chamados do condomínio</h1>
                    <p>Visão geral das solicitações de manutenção dos moradores.</p>
                </div>
            </div>

            <section class="secao-contagens" aria-labelledby="titulo-contagens">
                <h2 id="titulo-contagens">Resumo dos chamados</h2>
                <div
                    id="estadoContagens"
                    class="estado-lista estado-lista--carregando"
                    role="status"
                    aria-live="polite"
                    aria-atomic="true"
                >
                    <span class="indicador-carregamento" aria-hidden="true"></span>
                    <p>Carregando contagens...</p>
                </div>
                <div id="cartoesContagem" class="cartoes-contagem" hidden>
                    <article class="cartao-contagem cartao-contagem--abertos">
                        <span class="rotulo-contagem">Abertos</span>
                        <strong id="contagemAbertos" aria-label="Chamados abertos">—</strong>
                    </article>
                    <article class="cartao-contagem cartao-contagem--analise">
                        <span class="rotulo-contagem">Em análise</span>
                        <strong id="contagemEmAnalise" aria-label="Chamados em análise">—</strong>
                    </article>
                    <article class="cartao-contagem cartao-contagem--resolvidos">
                        <span class="rotulo-contagem">Resolvidos</span>
                        <strong id="contagemResolvidos" aria-label="Chamados resolvidos">—</strong>
                    </article>
                </div>
            </section>

            <div
                id="estadoLista"
                class="estado-lista estado-lista--carregando"
                role="status"
                aria-live="polite"
                aria-atomic="true"
            >
                <span class="indicador-carregamento" aria-hidden="true"></span>
                <p>Carregando chamados...</p>
            </div>

            <ul
                id="listaChamados"
                class="lista-chamados"
                aria-label="Chamados de todos os moradores"
                hidden
            ></ul>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/painel_admin.js') }}"></script>
</body>
</html>
